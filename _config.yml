# ---------------------------------------------------------------------------
# Ming Yu — Index
#
# GitHub Pages runs Jekyll on every push. This file exists for one reason:
# to turn the _blog/ folder into a set of pages. Everything that was already
# here — index.html, style.css, script.js — has no front matter, so Jekyll
# copies it through byte for byte and never touches it.
# ---------------------------------------------------------------------------

title: Ming Yu
description: >-
  Ng Ming Yu is a Computer Science undergraduate at NUS building practical
  software, AI agents, and games. View shipped projects, hackathon work, and
  notes.
url: https://mingyyu.github.io
baseurl: ""

# Drop a .md file in _blog/ and it becomes a page at /blog/<filename>/
# Drop an .html file in _visualise/ and it becomes a page at /visualise/<filename>/
collections:
  blog:
    output: true
    permalink: /blog/:name/
  visualise:
    output: true
    permalink: /visualise/:name/

# Defaults, so a new post only needs a title and a date.
defaults:
  - scope:
      path: ""
      type: blog
    values:
      layout: post
      accent: jade
  - scope:
      path: ""
      type: visualise
    values:
      layout: visual
      accent: marigold

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  hard_wrap: false

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
