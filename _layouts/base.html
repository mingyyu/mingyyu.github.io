<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ page.title }} &mdash; Ming Yu</title>
  <meta name="description" content="{{ page.description | default: site.description | strip_newlines | strip }}" />
  <meta name="theme-color" content="#EDEBE3" />

  <meta property="og:type" content="{{ page.og_type | default: 'website' }}" />
  <meta property="og:title" content="{{ page.title }} — Ming Yu" />
  <meta property="og:url" content="{{ page.url | absolute_url }}" />
  <meta property="og:description"
    content="{{ page.description | default: site.description | strip_newlines | strip }}" />

  <link rel="canonical" href="{{ page.url | absolute_url }}" />
  <link rel="icon" href="{{ '/favicon.svg' | relative_url }}" type="image/svg+xml" />
  <link rel="alternate" type="application/atom+xml" title="Ming Yu — Blog" href="{{ '/blog/feed.xml' | relative_url }}" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@400;500;600;700&family=Martian+Mono:wght@300;400;500;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="{{ '/style.css' | relative_url }}">
</head>

<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="topbar">
    <div class="topbar__inner">
      <a class="topbar__mark" href="{{ '/' | relative_url }}">
        <span class="topbar__mark-tile">M</span>
        <span class="topbar__mark-name">Ming&nbsp;Yu</span>
      </a>
      <nav class="topbar__nav" aria-label="Sections">
        <a href="{{ '/#work' | relative_url }}">Work</a>
        <a href="{{ '/#games' | relative_url }}">Games</a>
        <a href="{{ '/#about' | relative_url }}">About</a>
        <a href="{{ '/blog/' | relative_url }}">Blog</a>
        <a href="{{ '/#contact' | relative_url }}">Contact</a>
      </nav>
    </div>
  </header>

  <main id="main">
    {{ content }}
  </main>

  <footer class="foot">
    <div class="wrap foot__inner">
      <p>&copy; 2025 Ming Yu</p>
      <p>Set in Zilla Slab &amp; Martian Mono</p>
    </div>
  </footer>
</body>

</html>
